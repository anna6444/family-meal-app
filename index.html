<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>家庭膳食工作台</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f9f6ef; color: #333; padding-bottom: 100px; font-size: 15px; }
    .container { max-width: 740px; margin: 0 auto; padding: 18px; }

    /* 底部导航 */
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #ece7dc; display: flex; z-index: 99; height: 78px; align-items: flex-start; justify-content: space-around; padding-top: 4px; padding-bottom: env(safe-area-inset-bottom); }
    .tab-item { flex: 1; text-align: center; padding-top: 10px; font-size: 15px; color: #666; cursor: pointer; position: relative; font-weight: 500; }
    .tab-item.active { color: #e6703b; }
    .tab-center { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 0; cursor: pointer; }
    .center-line-wrap { position: relative; width: 64px; height: 14px; }
    .center-line { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: #ece7dc; }
    .center-arc { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 52px; height: 26px; border-radius: 52px 52px 0 0; background: #fff; border-left: 1px solid #ece7dc; border-right: 1px solid #ece7dc; border-top: 1px solid #ece7dc; border-bottom: none; }
    .red-dot { position: absolute; top: -2px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: #ff4d4f; border: 2px solid #fff; z-index: 3; }
    .tab-center-text { margin-top: 8px; font-size: 16px; color: #666; font-weight: 600; }
    .tab-center-text.active { color: #e6703b; }

    /* 卡片通用 */
    .card { background: #fff; border-radius: 22px; padding: 22px; margin-bottom: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .card h2 { font-size: 19px; margin-bottom: 12px; font-weight: 600; }
    .card-subtitle { font-size: 14px; color: #666; margin-bottom: 10px; }
    .btn { background: #e6703b; color: #fff; border: none; border-radius: 14px; padding: 12px 16px; cursor: pointer; font-size: 15px; }
    .btn.secondary { background: #f1ede4; color: #333; }
    .btn.small { padding: 9px 14px; font-size: 14px; border-radius: 12px; }
    .tag { display: inline-block; background: #f4ece3; color: #b06237; border-radius: 20px; padding: 5px 10px; font-size: 13px; margin: 3px; }
    .tag.green { background: #eaf6ec; color: #2b703b; }
    .tag.orange { background: #fff1e6; color: #c46838; }

    .date-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 6px 0 14px; }
    .date-item { min-width: 80px; padding: 12px 8px; border-radius: 16px; text-align: center; background: #fff; border: 1px solid #e8e2d6; cursor: pointer; flex-shrink: 0; font-size: 15px; }
    .date-item.active { background: #f7e4d8; border-color: #e6703b; }

    .input-wrap { margin: 14px 0; }
    label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
    input, textarea, select { width: 100%; border: 1px solid #ddd8ce; border-radius: 14px; padding: 12px; font-size: 15px; background: #fff; }
    
    input[type="date"] { display: block; width: 100%; padding: 12px; appearance: none; -webkit-appearance: none; min-height: 48px; }

    .dish-card { border-radius: 20px; background: #fff; padding: 20px; margin-bottom: 16px; border: 1px solid #f0ebe2; }
    .dish-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .feedback-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 16px; }
    .feedback-btn { border-radius: 14px; border: 1px solid #e2ddd2; padding: 12px 10px; text-align: center; cursor: pointer; font-size: 14px; }
    .feedback-btn.selected { background: #f7e4d8; border-color: #e6703b; }

    .tab-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .switch-btn { padding: 14px; border-radius: 14px; text-align: center; border: 1px solid #e8e2d6; cursor: pointer; font-size: 15px; }
    .switch-btn.active { background: #e6703b; color: white; border-color: #e6703b; }
    .list-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f1ede4; font-size: 15px; gap: 10px; }
    .empty-text { text-align: center; padding: 30px; color: #999; font-size: 14px; }
    .meal-title { font-size: 17px; font-weight: 600; margin: 22px 0 12px; color: #c46838; }
    .section-title { font-size: 16px; font-weight: 600; margin: 18px 0 10px; color: #555; }

    /* 弹窗 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
    .modal-box { background: #fff; border-radius: 22px; padding: 24px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
    .member-block { border: 1px solid #eee6db; border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    .member-block h4 { margin-bottom: 10px; }
    .pre-taboo-tag { display: inline-block; border: 1px solid #ddd; border-radius: 8px; padding: 4px 8px; margin: 4px; cursor: pointer; font-size: 13px; }
    .pre-taboo-tag.active { background: #e6703b; color: white; border-color: #e6703b; }

    /* 人员设置列表 */
    .member-list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #f1ede4; cursor: pointer; }
    .member-list-item:last-child { border-bottom: none; }
    .member-status-badge { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: #f1ede4; color: #666; }
    .status-work { background: #eaf6ec; color: #2b703b; }
    .status-rest { background: #fff1e6; color: #c46838; }
    .meal-label { display: inline-block; padding: 3px 8px; border-radius: 8px; background: #eaf6ec; color: #2b703b; font-size: 12px; margin-left: 4px; font-weight: 600;}
    
    /* 假期管理 */
    .holiday-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #eee; }
    .holiday-item:last-child { border-bottom: none; }
    
    /* 休息日标签 */
    .rest-day-tag { display: inline-flex; align-items: center; background: #fff1e6; color: #c46838; border-radius: 8px; padding: 6px 10px; font-size: 13px; margin: 4px; border: 1px solid #f7dcc8; }
    .rest-day-tag span { margin-left: 6px; cursor: pointer; color: #999; font-weight: bold; }
  </style>
</head>
<body>
<div id="app">
  <div class="container">

    <!-- 首页 -->
    <div v-if="view === 'home'">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h2>📅 今日膳食</h2>
          <input type="date" v-model="homeDate" style="width:auto;padding:10px 12px;font-size:14px"/>
        </div>
        <div class="card-subtitle">今日就餐人员及状态</div>
        <div v-for="m in todayMembers" :key="m.key" class="list-row">
          <div style="display: flex; align-items: center;">
            <span style="margin-right: 8px;">{{m
